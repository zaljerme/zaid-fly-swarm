; Zaid Fly — drone flight controller (Seeed XIAO ESP32-S3)
;
; Flash one drone:      pio run -t upload
; Set its swarm ID:     open the serial monitor and type   id 7   (0..19)
; The ID is stored in flash (NVS), so all 20 drones run the SAME binary.

[env:zaid_fly_drone]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -I ../common
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
build_src_flags = -Wall
