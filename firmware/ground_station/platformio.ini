; Zaid Fly — swarm ground station (USB <-> ESP-NOW bridge)
; Hardware: one Seeed XIAO ESP32-S3 (use the external U.FL antenna for range)
;           + optional big red E-STOP button between D1 (GPIO2) and GND.

[env:zaid_fly_ground_station]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600
build_flags =
    -O2
    -I ../common
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
